services:
  php:
    container_name: solaccess_backoffice_php
    build:
      dockerfile: ./docker/dev/php/Dockerfile
      context: .
    volumes:
      - ./:/var/www/html
  nginx:
    container_name: solaccess_backoffice_nginx
    image: nginx:1.28.2
    ports:
      - 8000:80
    volumes:
      - ./:/var/www/html:ro
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  mysql:
    container_name: solaccess_backoffice_mysql
    image: mysql:9.6.0
    env_file:
      - .env.local
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/dev/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
    environment:
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
  mailpit:
    container_name: solaccess_backoffice_mailpit
    image: axllent/mailpit:latest
    ports:
      - 1025:2025
      - 8025:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
volumes:
  mysql:
